<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Item 4-1 MBTI Card Generator</title><style>body{margin:0;background:#080914;color:#f8fafc;font-family:system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px 70px}.card{border:1px solid #334155;border-radius:24px;background:linear-gradient(145deg,#111827,#1e1b4b);padding:20px;margin:14px 0}button{border:0;border-radius:14px;padding:12px 14px;margin:6px;background:#67e8f9;color:#020617;font-weight:900;cursor:pointer}pre{white-space:pre-wrap;background:#020617;padding:16px;border-radius:16px}.result{font-size:22px}</style></head><body><div class="wrap"><a href="../">← 7iter</a><h1>Item 4-1 · MBTI 8-question Card Generator</h1><p>8개 상황 질문 → MBTI 산출 → gacha loading → animal-style holo card 속성 생성 mock.</p><div id="app"></div><pre id="out"></pre></div><script>
const questions=[["여행 마지막 날 밤, 숙소 분위기가 한창 좋을 때", "내일 피곤해도 일단 끝까지 같이 논다", "재밌어도 슬슬 먼저 들어가 쉰다", "E", "I"], ["카페에서 메뉴를 고를 때", "늘 먹던 안전한 메뉴를 시킨다", "이름이 이상하면 오히려 궁금해서 시켜본다", "S", "N"], ["친구가 연애 고민을 털어놓을 때", "그래서 지금 가장 현실적으로 뭘 해야 하는데?", "근데 그 사람이 왜 그런 감정이 들었을까?", "T", "F"], ["과제나 프로젝트 마감이 일주일 남았을 때", "며칠 단위로 나눠서 미리 끝내둔다", "막상 닥치면 집중 잘 되니까 일단 미룬다", "J", "P"], ["단체 사진 찍을 때", "누가 시키지 않아도 가운데 근처로 간다", "가장자리나 뒤쪽이 편하다", "E", "I"], ["길을 걷다가 처음 보는 골목이 나오면", "저쪽 뭐 있을까? 하며 한번 들어가본다", "굳이 모험 안 하고 원래 가던 길로 간다", "N", "S"], ["팀플에서 의견 충돌이 생기면", "틀린 부분이 보이면 분위기랑 별개로 바로 말한다", "맞는 말이어도 상대 기분 상할까 표현을 조심한다", "T", "F"], ["휴일 하루가 갑자기 비게 되었을 때", "즉흥적으로 뭐든 생기면 움직인다", "대충이라도 하루 계획을 세워야 마음이 편하다", "P", "J"]];
const dict={"INFP": {"type": "Fairy", "emoji": "🧚", "tone": "감성적 이상주의자", "prompt": "soft fairy-like animal hero, dreamy pastel illustration, no text"}, "INFJ": {"type": "Psychic", "emoji": "🔮", "tone": "통찰과 신비", "prompt": "mystic fox/deer animal hero, psychic aura, no text"}, "INTJ": {"type": "Dragon", "emoji": "🐉", "tone": "전략형 압도감", "prompt": "small dragon strategist animal hero, premium illustration, no text"}, "INTP": {"type": "Electric", "emoji": "⚡", "tone": "번뜩이는 발상", "prompt": "electric raccoon inventor animal hero, no text"}, "ISFP": {"type": "Grass", "emoji": "🌿", "tone": "조용한 자유로움", "prompt": "gentle forest cat animal hero, grass aura, no text"}, "ISFJ": {"type": "Water", "emoji": "💧", "tone": "안정적 배려", "prompt": "calm otter guardian animal hero, water aura, no text"}, "ISTJ": {"type": "Steel", "emoji": "🛡️", "tone": "규칙과 신뢰", "prompt": "steel badger guardian animal hero, no text"}, "ISTP": {"type": "Rock", "emoji": "🪨", "tone": "실전형 침착함", "prompt": "rock armadillo mechanic animal hero, no text"}, "ENFP": {"type": "Fire", "emoji": "🔥", "tone": "분위기 점화", "prompt": "fire puppy performer animal hero, energetic, no text"}, "ENFJ": {"type": "Flying", "emoji": "🪽", "tone": "이끄는 존재감", "prompt": "winged lion/rabbit leader animal hero, no text"}, "ENTJ": {"type": "Fighting", "emoji": "🥊", "tone": "추진력과 정면돌파", "prompt": "fighting tiger commander animal hero, no text"}, "ENTP": {"type": "Ghost", "emoji": "👻", "tone": "룰을 비트는 장난기", "prompt": "ghost fox trickster animal hero, no text"}, "ESFP": {"type": "Normal", "emoji": "⭐", "tone": "친화력과 무대감", "prompt": "star hamster entertainer animal hero, no text"}, "ESFJ": {"type": "Ice", "emoji": "❄️", "tone": "단정하고 섬세", "prompt": "ice swan/rabbit caretaker animal hero, no text"}, "ESTP": {"type": "Dark", "emoji": "🌑", "tone": "스릴과 순간판단", "prompt": "dark panther adventurer animal hero, no text"}, "ESTJ": {"type": "Ground", "emoji": "⛰️", "tone": "현실적 운영력", "prompt": "ground bull/boar organizer animal hero, no text"}};
let score={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0}, step=0;
function render(){const app=document.getElementById('app'); if(step>=questions.length) return result(); const q=questions[step]; app.innerHTML=`<div class="card"><b>Q${step+1}. ${q[0]}</b><p><button onclick="pick('${q[3]}')">${q[1]}</button></p><p><button onclick="pick('${q[4]}')">${q[2]}</button></p></div>`}
function pick(k){score[k]++; step++; render()}
function result(){const mbti=(score.E>=score.I?'E':'I')+(score.S>=score.N?'S':'N')+(score.T>=score.F?'T':'F')+(score.J>=score.P?'J':'P'); const d=dict[mbti]; document.getElementById('app').innerHTML=`<div class="card result">✨ GACHA DRAW COMPLETE<br><h2>${mbti} · ${d.type} Type ${d.emoji}</h2><p>${d.tone}</p><p>Lv. ${20+mbti.charCodeAt(0)%30} · 공격: ${d.type} Burst · 패시브: ${d.tone}</p><p>Card No. 4-1-${mbti}</p></div>`; document.getElementById('out').textContent='Image prompt: '+d.prompt+'\n\nDictionary entry:\n'+JSON.stringify(d,null,2)}
render();</script></body></html>
